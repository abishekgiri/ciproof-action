name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # The committed bundle must match a fresh build of src/.
      - run: npm run package:check
      - name: Fail if dist/ drifted from source
        run: git diff --exit-code -- dist

  # Exercises the built action end-to-end against the real published CIProof
  # package on every supported OS. This uses the network (npm registry).
  self-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Clean workflow analyzes as expected
        id: clean
        uses: ./
        with:
          command: check
          working-directory: .

      - name: Assert clean verdict
        shell: bash
        run: |
          test "${{ steps.clean.outputs.verdict }}" = "clean" \
            || { echo "expected clean, got '${{ steps.clean.outputs.verdict }}'"; exit 1; }

      - name: Refuted fixture is detected (without failing the job)
        id: refuted
        uses: ./
        with:
          command: check
          working-directory: test/fixtures/refuted
          fail-on-refuted: false

      - name: Assert refuted verdict and counts
        shell: bash
        run: |
          test "${{ steps.refuted.outputs.verdict }}" = "refuted" \
            || { echo "expected refuted, got '${{ steps.refuted.outputs.verdict }}'"; exit 1; }
          test "${{ steps.refuted.outputs.refuted-count }}" = "1" \
            || { echo "expected refuted-count 1, got '${{ steps.refuted.outputs.refuted-count }}'"; exit 1; }
